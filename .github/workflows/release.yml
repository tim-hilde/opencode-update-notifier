name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check for pending changesets
        id: changesets
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "pending=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: Version bump + update README
        if: steps.changesets.outputs.pending != '0'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          bun run changeset version
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "chore: release v$VERSION"
          git push

      - name: Publish to npm
        if: steps.changesets.outputs.pending != '0'
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.pending != '0'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "${NOTES:-See CHANGELOG.md for details.}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
